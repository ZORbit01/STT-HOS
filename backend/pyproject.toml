[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    ".venv",
    "alembic/versions",
    "vosk-model-small-en-us-0.15",
]

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PERF",
    "PIE",
    "RET",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "B008",
    "E501",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/**/*.py" = ["S101"]
