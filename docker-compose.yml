services:

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orpassword}
      POSTGRES_DB: ${POSTGRES_DB:-or_tracking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oruser} -d ${POSTGRES_DB:-or_tracking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    restart: "no"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oruser}:${POSTGRES_PASSWORD:-orpassword}@postgres:5432/${POSTGRES_DB:-or_tracking}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  init-admin:
    build:
      context: ./backend
    restart: "no"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oruser}:${POSTGRES_PASSWORD:-orpassword}@postgres:5432/${POSTGRES_DB:-or_tracking}
    command: ["python", "-m", "app.bootstrap_admin"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oruser}:${POSTGRES_PASSWORD:-orpassword}@postgres:5432/${POSTGRES_DB:-or_tracking}
    volumes:
      - ./backend/vosk-model-small-en-us-0.15:/app/vosk-model-small-en-us-0.15:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      init-admin:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
